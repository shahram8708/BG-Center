<style>
/* BG Command Centre - Portfolio Dashboard design pass.
   Scoped to .db-shell so it only affects the dashboard page. Matches the
   project-wide refined identity (violet #7C3AED -> magenta #C026D3) used across
   the redesigned folders. */
.db-shell {
  --db-primary: #7C3AED;
  --db-accent: #C026D3;
  --db-tint: #F5F3FF;
  --db-ink: #111827;
  --db-body: #374151;
  --db-muted: #6B7280;
  --db-border: #E5E7EB;
  --db-border-strong: #D1D5DB;
  --db-grad: linear-gradient(135deg, var(--db-primary), var(--db-accent));
  --db-radius: 16px;
  --db-radius-sm: 10px;
  --db-shadow: 0 1px 2px rgba(17,24,39,.05), 0 10px 28px rgba(124,58,237,.08);
  --db-shadow-hover: 0 12px 32px rgba(124,58,237,.18);
  --db-transition: .22s cubic-bezier(.4,0,.2,1);
}
.db-shell { color: var(--db-body); }

/* ---- Page header ---- */
.db-page-head { margin-bottom: 1.5rem; }
.db-eyebrow {
  display: inline-flex; align-items: center; gap: .45rem;
  font-size: .68rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase;
  color: var(--db-primary); background: var(--db-tint); border: 1px solid #E4DDFD;
  padding: .28rem .7rem; border-radius: 999px; margin-bottom: .6rem;
}
.db-title { font-size: 1.6rem; font-weight: 800; color: var(--db-ink); letter-spacing: -.02em; margin-bottom: .2rem; }
.db-subtitle { font-size: .92rem; color: var(--db-muted); margin-bottom: 0; }
.db-subtitle .db-role { display: inline-flex; align-items: center; gap: .3rem; background: var(--db-tint); color: var(--db-primary); border-radius: 999px; padding: .2rem .7rem; font-size: .78rem; font-weight: 600; }

/* ---- KPI cards ---- */
.db-kpis { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1.2rem; margin-bottom: 1.5rem; }
.db-kpi { display: flex; align-items: center; gap: 1rem; padding: 1.3rem; background: var(--db-surface, #fff); border: 1px solid var(--db-border); border-radius: var(--db-radius); box-shadow: var(--db-shadow); transition: transform var(--db-transition), box-shadow var(--db-transition), border-color var(--db-transition); }
.db-kpi:hover { transform: translateY(-3px); box-shadow: var(--db-shadow-hover); border-color: #D8C7FB; }
.db-kpi-icon { width: 54px; height: 54px; border-radius: 14px; flex-shrink: 0; display: inline-flex; align-items: center; justify-content: center; font-size: 1.4rem; color: #fff; background: var(--db-grad); box-shadow: 0 6px 16px rgba(124,58,237,.35); }
.db-kpi-icon.alt { background: linear-gradient(135deg, #10B981, #059669); box-shadow: 0 6px 16px rgba(16,185,129,.3); }
.db-kpi-label { font-size: .8rem; color: var(--db-muted); font-weight: 600; }
.db-kpi-value { font-size: 1.65rem; font-weight: 800; color: var(--db-ink); letter-spacing: -.02em; line-height: 1.1; }
.db-kpi-hint { font-size: .78rem; color: var(--db-muted); }

/* ---- Chart cards ---- */
.db-card { background: var(--db-surface, #fff); border: 1px solid var(--db-border); border-radius: var(--db-radius); box-shadow: var(--db-shadow); overflow: hidden; margin-bottom: 1.2rem; }
.db-card-head { display: flex; align-items: center; gap: .6rem; padding: .95rem 1.2rem; border-bottom: 1px solid var(--db-border); font-weight: 700; color: var(--db-ink); font-size: .95rem; }
.db-card-head i { color: var(--db-primary); font-size: 1.05rem; }
.db-card-body { padding: 1.2rem; }
.db-chart-title { font-size: .84rem; font-weight: 600; color: var(--db-ink); margin-bottom: .5rem; }
.db-chart-wrap { position: relative; height: 220px; }

/* ---- Chart metric toggle (preserve data-chart-metric + btn classes) ---- */
.db-toggle .btn { border-radius: 8px; font-weight: 600; }
.db-toggle .btn-brand { box-shadow: 0 3px 10px rgba(124,58,237,.3); }
.db-toggle .btn-outline-brand { border-color: var(--db-border-strong); }

/* ---- Empty / preparing states ---- */
.db-empty { text-align: center; padding: 3rem 1.5rem; }
.db-empty-icon { width: 68px; height: 68px; border-radius: 20px; margin: 0 auto 1rem; display: inline-flex; align-items: center; justify-content: center; background: var(--db-tint); color: var(--db-primary); font-size: 1.9rem; }
.db-empty-title { font-size: 1.05rem; font-weight: 700; color: var(--db-ink); margin-bottom: .3rem; }
.db-empty-text { font-size: .88rem; color: var(--db-muted); max-width: 460px; margin: 0 auto; }
.db-empty-action { margin-top: 1.1rem; }

/* ---- Buttons ---- */
.db-btn { display: inline-flex; align-items: center; gap: .45rem; border-radius: var(--db-radius-sm); font-weight: 600; padding: .55rem 1.05rem; font-size: .9rem; border: 1px solid transparent; text-decoration: none; cursor: pointer; transition: all var(--db-transition); }
.db-btn-primary { background: var(--db-grad); color: #fff; box-shadow: 0 4px 14px rgba(124,58,237,.35); }
.db-btn-primary:hover { color: #fff; filter: brightness(1.06); box-shadow: 0 6px 20px rgba(124,58,237,.45); transform: translateY(-1px); }
.db-btn-primary:active { transform: translateY(0); }
.db-btn:focus-visible { outline: 2px solid var(--db-primary); outline-offset: 2px; }

/* ---- Responsive ---- */
@media (max-width: 767.98px) {
  .db-title { font-size: 1.3rem; }
  .db-kpis { grid-template-columns: 1fr; gap: .9rem; }
  .db-kpi-value { font-size: 1.4rem; }
  .db-chart-wrap { height: 200px; }
}
</style>
