<style>
/* BG Command Centre - Policy Q&A Assistant design pass.
   Scoped to .asst-shell so it only affects the assistant page. Mirrors the
   project-wide refined identity (violet #7C3AED -> magenta #C026D3) established
   in the redesigned Admin and Approval folders. */
.asst-shell {
  --asst-primary: #7C3AED;
  --asst-primary-dark: #6D28D9;
  --asst-accent: #C026D3;
  --asst-tint: #F5F3FF;
  --asst-ink: #111827;
  --asst-body: #374151;
  --asst-muted: #6B7280;
  --asst-canvas: #F9FAFB;
  --asst-surface: #FFFFFF;
  --asst-border: #E5E7EB;
  --asst-border-strong: #D1D5DB;
  --asst-grad: linear-gradient(135deg, var(--asst-primary), var(--asst-accent));
  --asst-radius: 16px;
  --asst-radius-sm: 10px;
  --asst-shadow: 0 1px 2px rgba(17,24,39,.05), 0 10px 28px rgba(124,58,237,.08);
  --asst-shadow-hover: 0 12px 32px rgba(124,58,237,.18);
  --asst-transition: .22s cubic-bezier(.4,0,.2,1);
}
.asst-shell { color: var(--asst-body); }

/* ---- Page header ---- */
.asst-page-head { margin-bottom: 1.5rem; }
.asst-eyebrow {
  display: inline-flex; align-items: center; gap: .45rem;
  font-size: .68rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase;
  color: var(--asst-primary); background: var(--asst-tint); border: 1px solid #E4DDFD;
  padding: .28rem .7rem; border-radius: 999px; margin-bottom: .65rem;
}
.asst-title { font-size: 1.6rem; font-weight: 800; color: var(--asst-ink); letter-spacing: -.02em; margin-bottom: .2rem; }
.asst-subtitle { font-size: .92rem; color: var(--asst-muted); margin-bottom: 0; }

/* ---- Conversation card ---- */
.asst-conv {
  background: var(--asst-surface); border: 1px solid var(--asst-border);
  border-radius: var(--asst-radius); box-shadow: var(--asst-shadow); overflow: hidden;
  display: flex; flex-direction: column; height: 62vh;
}
.asst-conv-bar {
  display: flex; align-items: center; gap: .6rem; padding: .9rem 1.1rem;
  border-bottom: 1px solid var(--asst-border); background: var(--asst-canvas);
}
.asst-conv-bar .asst-avatar {
  width: 34px; height: 34px; border-radius: 10px; display: inline-flex; align-items: center; justify-content: center;
  background: var(--asst-grad); color: #fff; font-size: 1rem; box-shadow: 0 3px 8px rgba(124,58,237,.3);
}
.asst-conv-bar .asst-name { font-weight: 700; color: var(--asst-ink); font-size: .95rem; }
.asst-conv-bar .asst-status { font-size: .75rem; color: var(--asst-muted); display: inline-flex; align-items: center; gap: .3rem; }
.asst-conv-bar .asst-status .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--asst-success, #16A34A); display: inline-block; }

/* ---- Thread (preserves the shared .assistant-thread class) ---- */
.asst-thread, .asst-shell .assistant-thread { flex-grow: 1; overflow-y: auto; padding: 1.1rem; background: var(--asst-canvas); }

/* ---- Messages (preserve .assistant-msg / .assistant-user / .assistant-bot) ---- */
.asst-shell .assistant-msg {
  max-width: 78%; border-radius: 14px; padding: .65rem .85rem; margin-bottom: .65rem;
  line-height: 1.45; font-size: .9rem; animation: asst-in .22s ease;
}
.asst-shell .assistant-user {
  margin-left: auto; background: var(--asst-grad); color: #fff;
  border-bottom-right-radius: 4px; box-shadow: 0 4px 12px rgba(124,58,237,.25);
}
.asst-shell .assistant-user .fw-semibold { color: rgba(255,255,255,.85) !important; }
.asst-shell .assistant-user a { color: #fff; }
.asst-shell .assistant-bot {
  background: var(--asst-surface); border: 1px solid var(--asst-border);
  border-bottom-left-radius: 4px; box-shadow: 0 2px 8px rgba(17,24,39,.05);
}
.asst-shell .assistant-msg .fw-semibold { font-size: .72rem; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; margin-bottom: .25rem; }
.asst-shell .assistant-msg .small { font-size: .9rem; color: inherit; }
.asst-shell .assistant-msg .text-muted { color: var(--asst-muted) !important; font-size: .78rem; }
.asst-shell .assistant-msg a { color: var(--asst-primary); font-weight: 600; text-decoration: none; }
.asst-shell .assistant-msg a:hover { text-decoration: underline; }

@keyframes asst-in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

/* ---- Input bar (preserve .assistant-input) ---- */
.asst-inputbar { border-top: 1px solid var(--asst-border); padding: .85rem 1rem; display: flex; gap: .6rem; background: var(--asst-surface); }
.asst-inputbar .form-control {
  border-radius: 999px; border: 1px solid var(--asst-border-strong); padding: .6rem 1rem; font-size: .92rem;
  transition: border-color var(--asst-transition), box-shadow var(--asst-transition);
}
.asst-inputbar .form-control:focus { border-color: var(--asst-primary); box-shadow: 0 0 0 .2rem rgba(124,58,237,.15); outline: none; }

/* ---- Buttons ---- */
.asst-btn {
  display: inline-flex; align-items: center; gap: .45rem; border-radius: 999px; font-weight: 600;
  padding: .55rem 1.1rem; font-size: .9rem; border: 1px solid transparent; cursor: pointer;
  transition: all var(--asst-transition);
}
.asst-btn-primary { background: var(--asst-grad); color: #fff; box-shadow: 0 4px 14px rgba(124,58,237,.35); }
.asst-btn-primary:hover { color: #fff; filter: brightness(1.06); box-shadow: 0 6px 20px rgba(124,58,237,.45); transform: translateY(-1px); }
.asst-btn-primary:active { transform: translateY(0); }
.asst-btn-primary:disabled { opacity: .6; box-shadow: none; transform: none; cursor: not-allowed; }
.asst-btn:focus-visible { outline: 2px solid var(--asst-primary); outline-offset: 2px; }

/* ---- Disclaimer ---- */
.asst-disclaimer { display: flex; align-items: flex-start; gap: .6rem; border: 1px solid var(--asst-border); border-left: 4px solid var(--asst-accent); background: var(--asst-surface); border-radius: var(--asst-radius-sm); padding: .85rem 1rem; font-size: .82rem; color: var(--asst-muted); margin-top: 1rem; }
.asst-disclaimer i { color: var(--asst-accent); font-size: 1.05rem; }

/* ---- Responsive ---- */
@media (max-width: 767.98px) {
  .asst-title { font-size: 1.3rem; }
  .asst-page-head { margin-bottom: 1.1rem; }
  .asst-conv { height: 70vh; }
  .asst-shell .assistant-msg { max-width: 92%; }
}
</style>
