<style>
/* BG Command Centre - Documents Suite design pass.
   Scoped to .doc-shell so it only affects pages in this folder. Matches the
   project-wide refined identity (violet #7C3AED -> magenta #C026D3) used across
   the redesigned folders. */
.doc-shell {
  --doc-primary: #7C3AED;
  --doc-accent: #C026D3;
  --doc-tint: #F5F3FF;
  --doc-ink: #111827;
  --doc-body: #374151;
  --doc-muted: #6B7280;
  --doc-border: #E5E7EB;
  --doc-border-strong: #D1D5DB;
  --doc-grad: linear-gradient(135deg, var(--doc-primary), var(--doc-accent));
  --doc-radius: 16px;
  --doc-radius-sm: 10px;
  --doc-shadow: 0 1px 2px rgba(17,24,39,.05), 0 10px 28px rgba(124,58,237,.08);
  --doc-shadow-hover: 0 12px 32px rgba(124,58,237,.18);
  --doc-transition: .22s cubic-bezier(.4,0,.2,1);
}
.doc-shell { color: var(--doc-body); }

/* ---- Page header ---- */
.doc-page-head { margin-bottom: 1.5rem; }
.doc-eyebrow {
  display: inline-flex; align-items: center; gap: .45rem;
  font-size: .68rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase;
  color: var(--doc-primary); background: var(--doc-tint); border: 1px solid #E4DDFD;
  padding: .28rem .7rem; border-radius: 999px; margin-bottom: .6rem;
}
.doc-title { font-size: 1.6rem; font-weight: 800; color: var(--doc-ink); letter-spacing: -.02em; margin-bottom: .2rem; }
.doc-subtitle { font-size: .92rem; color: var(--doc-muted); margin-bottom: 0; }
.doc-head-actions { display: flex; align-items: center; gap: .6rem; flex-wrap: wrap; }

/* ---- Buttons ---- */
.doc-btn {
  display: inline-flex; align-items: center; gap: .45rem; border-radius: var(--doc-radius-sm);
  font-weight: 600; padding: .5rem 1rem; font-size: .88rem; border: 1px solid transparent;
  transition: all var(--doc-transition); text-decoration: none; cursor: pointer;
}
.doc-btn-primary { background: var(--doc-grad); color: #fff; box-shadow: 0 4px 14px rgba(124,58,237,.35); }
.doc-btn-primary:hover { color: #fff; filter: brightness(1.06); box-shadow: 0 6px 20px rgba(124,58,237,.45); transform: translateY(-1px); }
.doc-btn-primary:active { transform: translateY(0); }
.doc-btn-ghost { background: #fff; border-color: var(--doc-border-strong); color: var(--doc-body); }
.doc-btn-ghost:hover { border-color: var(--doc-primary); color: var(--doc-primary); background: var(--doc-tint); }
.doc-btn-danger { background: #fff; border-color: #F3C6C6; color: #DC2626; }
.doc-btn-danger:hover { background: #FEF2F2; border-color: #DC2626; color: #DC2626; }
.doc-btn-sm { padding: .34rem .68rem; font-size: .8rem; }
.doc-btn:focus-visible { outline: 2px solid var(--doc-primary); outline-offset: 2px; }

/* ---- Cards ---- */
.doc-card { background: var(--doc-surface, #fff); border: 1px solid var(--doc-border); border-radius: var(--doc-radius); box-shadow: var(--doc-shadow); overflow: hidden; }
.doc-card-hover { transition: transform var(--doc-transition), box-shadow var(--doc-transition), border-color var(--doc-transition); }
.doc-card-hover:hover { transform: translateY(-4px); box-shadow: var(--doc-shadow-hover); border-color: #D8C7FB; }

/* ---- Draft cards ---- */
.doc-draft { display: flex; flex-direction: column; padding: 1.2rem; }
.doc-draft-head { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: .5rem; }
.doc-draft-name { font-weight: 700; color: var(--doc-ink); font-size: 1rem; }
.doc-draft-vendor { font-size: .84rem; color: var(--doc-muted); }
.doc-draft-meta { font-size: .82rem; color: var(--doc-muted); margin-bottom: .25rem; }
.doc-draft-meta strong { color: var(--doc-ink); }
.doc-badge { display: inline-flex; align-items: center; background: var(--doc-tint); color: var(--doc-primary); border-radius: 999px; padding: .22rem .6rem; font-size: .72rem; font-weight: 700; }
.doc-section-label { font-size: .78rem; color: var(--doc-muted); font-weight: 600; margin-bottom: .35rem; }
.doc-draft-actions { display: flex; gap: .5rem; margin-top: auto; }
.doc-draft-actions .doc-btn-primary { flex: 1; }

/* ---- Tier badges (macro output) ---- */
.doc-shell .tier-badge, .doc-shell .tier-low, .doc-shell .tier-high, .doc-shell .tier-prohibited { border-radius: 999px; padding: .22rem .62rem; font-size: .74rem; font-weight: 700; }
.doc-shell .tier-low { background: #DCFCE7; color: #15803D; }
.doc-shell .tier-high { background: #FEF3C7; color: #B45309; }
.doc-shell .tier-prohibited { background: #FEE2E2; color: #B91C1C; }

/* ---- Filter bar ---- */
.doc-filter { background: var(--doc-surface, #fff); border: 1px solid var(--doc-border); border-radius: var(--doc-radius); box-shadow: var(--doc-shadow); padding: 1rem 1.1rem; }
.doc-filter .form-label { font-size: .76rem; font-weight: 700; color: var(--doc-muted); text-transform: uppercase; letter-spacing: .04em; margin-bottom: .3rem; }
.doc-filter .form-control, .doc-filter .form-select { border-radius: var(--doc-radius-sm); border: 1px solid var(--doc-border-strong); font-size: .9rem; }
.doc-filter .form-control:focus, .doc-filter .form-select:focus { border-color: var(--doc-primary); box-shadow: 0 0 0 .2rem rgba(124,58,237,.16); outline: none; }

/* ---- Tables ---- */
.doc-table-wrap { overflow-x: auto; }
.doc-table { width: 100%; border-collapse: collapse; }
.doc-table thead th {
  background: var(--doc-canvas, #F9FAFB); color: var(--doc-muted); font-size: .72rem; font-weight: 700;
  text-transform: uppercase; letter-spacing: .05em; padding: .85rem 1rem; text-align: left;
  border-bottom: 1px solid var(--doc-border); white-space: nowrap;
}
.doc-table tbody td { padding: .85rem 1rem; border-bottom: 1px solid var(--doc-border); font-size: .9rem; color: var(--doc-body); vertical-align: middle; }
.doc-table tbody tr { transition: background var(--doc-transition); }
.doc-table tbody tr:hover { background: var(--doc-tint); }
.doc-table tbody tr:last-child td { border-bottom: none; }
.doc-table .cell-strong { color: var(--doc-ink); font-weight: 600; }
.doc-table .cell-muted { color: var(--doc-muted); }

/* ---- Empty state ---- */
.doc-empty { text-align: center; padding: 3rem 1.5rem; }
.doc-empty-icon { width: 68px; height: 68px; border-radius: 20px; margin: 0 auto 1rem; display: inline-flex; align-items: center; justify-content: center; background: var(--doc-tint); color: var(--doc-primary); font-size: 1.9rem; }
.doc-empty-title { font-size: 1.05rem; font-weight: 700; color: var(--doc-ink); margin-bottom: .3rem; }
.doc-empty-text { font-size: .88rem; color: var(--doc-muted); max-width: 460px; margin: 0 auto; }
.doc-empty-action { margin-top: 1.1rem; }

/* ---- Viewer ---- */
.doc-viewer { background: var(--doc-surface, #fff); border: 1px solid var(--doc-border); border-radius: var(--doc-radius); overflow: hidden; box-shadow: var(--doc-shadow); }
.doc-viewer-frame { width: 100%; height: 78vh; border: 0; display: block; }
.doc-breadcrumb { background: transparent; padding: 0; margin-bottom: 0; }
.doc-breadcrumb .breadcrumb-item a { color: var(--doc-muted); text-decoration: none; font-weight: 500; }
.doc-breadcrumb .breadcrumb-item a:hover { color: var(--doc-primary); }
.doc-breadcrumb .breadcrumb-item.active { color: var(--doc-ink); font-weight: 600; }
.doc-breadcrumb .breadcrumb-item + .breadcrumb-item::before { color: var(--doc-border-strong); }

/* ---- Responsive ---- */
@media (max-width: 767.98px) {
  .doc-title { font-size: 1.3rem; }
  .doc-page-head { margin-bottom: 1.1rem; }
  .doc-table thead { display: none; }
  .doc-table, .doc-table tbody, .doc-table tr, .doc-table td { display: block; width: 100%; }
  .doc-table tbody tr { padding: .7rem; border-bottom: 1px solid var(--doc-border); }
  .doc-table tbody td { border: none; padding: .28rem .4rem; display: flex; justify-content: space-between; gap: 1rem; }
  .doc-table tbody td::before { content: attr(data-label); font-weight: 700; color: var(--doc-muted); font-size: .72rem; text-transform: uppercase; letter-spacing: .04em; }
  .doc-viewer-frame { height: 70vh; }
}
</style>
