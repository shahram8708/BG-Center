<style>
/* BG Command Centre - shared layout component design pass.
   Defined in the components folder so it only ships with these components.
   Refines the project identity (violet #7C3AED -> magenta #C026D3) consistently
   with the redesigned page folders, without touching shared app.css. */
:root {
  --cmp-primary: #7C3AED;
  --cmp-accent: #C026D3;
  --cmp-tint: #F5F3FF;
  --cmp-ink: #111827;
  --cmp-body: #374151;
  --cmp-muted: #6B7280;
  --cmp-border: #E5E7EB;
  --cmp-grad: linear-gradient(135deg, var(--cmp-primary), var(--cmp-accent));
  --cmp-radius: 12px;
  --cmp-transition: .2s cubic-bezier(.4,0,.2,1);
}

/* ---- Brand mark & logo ---- */
.brand-mark {
  border-radius: 10px; box-shadow: 0 4px 12px rgba(124,58,237,.35);
}

/* ---- Navbar ---- */
.navbar-bgcc { background: rgba(255,255,255,.9); backdrop-filter: blur(8px); }
.navbar-bgcc .nav-link { font-weight: 500; color: var(--cmp-body); border-radius: 8px; padding: .5rem .8rem; }
.navbar-bgcc .nav-link:hover { color: var(--cmp-primary); background: var(--cmp-tint); }
.bell-btn { border-radius: 10px; transition: all var(--cmp-transition); }
.bell-btn:hover { background: var(--cmp-tint); color: var(--cmp-primary); }
.badge-dot { background: var(--cmp-primary); }
.avatar { box-shadow: 0 3px 8px rgba(124,58,237,.3); }

/* ---- Account dropdown ---- */
.dropdown-menu { border-radius: 14px; border: 1px solid var(--cmp-border); box-shadow: 0 12px 32px rgba(17,24,39,.12); padding: .4rem; }
.dropdown-item { border-radius: 8px; font-weight: 500; }
.dropdown-item:hover { background: var(--cmp-tint); color: var(--cmp-primary); }
.role-badge { background: var(--cmp-tint); color: var(--cmp-primary); border-radius: 999px; }

/* ---- Sidebar ---- */
.sidebar-section-title { color: var(--cmp-muted); }
.sidebar-link { border-radius: 10px; transition: background var(--cmp-transition), color var(--cmp-transition); }
.sidebar-link i { transition: color var(--cmp-transition); }
.sidebar-link:hover { background: var(--cmp-tint); color: var(--cmp-primary); }
.sidebar-link.active { background: var(--cmp-tint); color: var(--cmp-primary); font-weight: 600; box-shadow: inset 3px 0 0 var(--cmp-primary); }
.sidebar-link.active i { color: var(--cmp-primary); }

/* ---- Footers ---- */
.footer-full { background: linear-gradient(160deg, #1F1233, #14111F); }
.footer-full .brand-mark { box-shadow: none; }
.footer-full h6 { color: #fff; }
.footer-full a { transition: color var(--cmp-transition); }
.footer-slim { border-top: 1px solid var(--cmp-border); background: #fff; }

/* ---- Flash alerts ---- */
.alert { border-radius: 12px; box-shadow: 0 2px 8px rgba(17,24,39,.06); }

/* ---- Notifications modal ---- */
.modal-content { border-radius: 16px; border: 1px solid var(--cmp-border); box-shadow: 0 24px 60px rgba(17,24,39,.18); }
.modal-header { border-bottom: 1px solid var(--cmp-border); }

/* ---- Assistant widget ---- */
.assistant-fab { box-shadow: 0 10px 26px rgba(124,58,237,.45); }
.assistant-panel { border-radius: 16px; border: 1px solid var(--cmp-border); box-shadow: 0 20px 50px rgba(17,24,39,.18); }

/* ---- Sidebar toggle / backdrop (mobile) ---- */
.sidebar-toggle { border-radius: 10px; }

/* ---- Mobile Navigation & Sidebar Panels ---- */
@media (max-width: 991.98px) {
  .sidebar {
    background: #ffffff;
    border-right: 1px solid var(--cmp-border);
    box-shadow: none;
  }
  .sidebar.open {
    box-shadow: 14px 0 45px rgba(17, 24, 39, .22), 0 0 0 1px rgba(124, 58, 237, .08);
  }
  .sidebar-backdrop {
    background: rgba(17, 24, 39, .5);
    backdrop-filter: blur(4px);
  }
  .navbar-bgcc .navbar-collapse {
    background: #ffffff;
    border: 1px solid var(--cmp-border);
    border-radius: var(--cmp-radius);
    padding: 1.1rem 1.25rem;
    margin-top: .75rem;
    box-shadow: 0 16px 40px rgba(17, 24, 39, .14), 0 2px 8px rgba(124, 58, 237, .08);
  }
  .navbar-bgcc .navbar-nav .nav-link {
    padding: .65rem .85rem;
    border-radius: 8px;
    font-weight: 600;
    color: var(--cmp-ink);
  }
  .navbar-bgcc .navbar-nav .nav-link:hover,
  .navbar-bgcc .navbar-nav .nav-link:focus {
    background: var(--cmp-tint);
    color: var(--cmp-primary);
  }
  .navbar-bgcc .navbar-nav .nav-item + .nav-item {
    margin-top: .25rem;
  }
  .navbar-bgcc .navbar-nav .btn {
    width: 100%;
    margin-top: .65rem;
    text-align: center;
  }
}
</style>
