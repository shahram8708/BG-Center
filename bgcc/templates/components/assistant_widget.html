{% include "components/_components_style.html" %}
{% if active_nav != 'assistant' %}<div class="assistant-widget" data-assistant-widget>
  <button class="assistant-fab btn btn-brand" type="button" data-assistant-toggle aria-label="Open AI Assistant">
    <i class="bi bi-robot"></i>
  </button>
  <div class="assistant-panel card shadow" data-assistant-panel hidden>
    <div class="card-header d-flex align-items-center justify-content-between py-2 px-3 bg-light">
      <div class="d-flex align-items-center gap-2">
        <i class="bi bi-robot text-primary"></i>
        <div>
          <span class="fw-semibold small d-block lh-1">AI Assistant</span>
          <span class="text-muted" style="font-size:0.7rem;" data-widget-screen-label>Active Screen</span>
        </div>
      </div>
      <div class="d-flex align-items-center gap-1">
        <a href="/assistant/" class="btn btn-sm btn-link text-muted p-1" title="Open Full Assistant" data-widget-expand-link>
          <i class="bi bi-arrows-fullscreen"></i>
        </a>
        <button type="button" class="btn-close ms-1" data-assistant-close aria-label="Close"></button>
      </div>
    </div>
    <div class="card-body d-flex flex-column p-0" style="height: 380px;">
      <div class="assistant-thread flex-grow-1 p-3 overflow-auto" data-assistant-thread></div>
      <form class="assistant-input border-top p-2 d-flex gap-2" data-assistant-form>
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <input type="text" name="question" class="form-control form-control-sm" placeholder="Ask about this page or BG policy…" autocomplete="off" data-assistant-question required>
        <button class="btn btn-brand btn-sm" type="submit"><i class="bi bi-send"></i></button>
      </form>
    </div>
  </div>
</div>
<script>
(function () {
  "use strict";

  var csrf = function () {
    var m = document.querySelector("meta[name='csrf-token']");
    return m ? m.getAttribute("content") : "";
  };

  var widget = document.querySelector("[data-assistant-widget]");
  if (!widget) return;

  var fab = widget.querySelector("[data-assistant-toggle]");
  var panel = widget.querySelector("[data-assistant-panel]");
  var thread = widget.querySelector("[data-assistant-thread]");
  var form = widget.querySelector("[data-assistant-form]");
  var question = widget.querySelector("[data-assistant-question]");
  var screenLabel = widget.querySelector("[data-widget-screen-label]");
  var expandLink = widget.querySelector("[data-widget-expand-link]");

  function updateContextLink() {
    var currentUrl = window.location.pathname + window.location.search;
    if (expandLink) {
      expandLink.href = "/assistant/?context_url=" + encodeURIComponent(currentUrl);
    }
    if (screenLabel) {
      var title = document.title ? document.title.split("·")[0].trim() : "Current Screen";
      screenLabel.textContent = title;
    }
  }

  updateContextLink();

  fab.addEventListener("click", function () {
    panel.hidden = !panel.hidden;
    if (!panel.hidden) {
      updateContextLink();
      thread.scrollTop = thread.scrollHeight;
    }
  });

  widget.querySelector("[data-assistant-close]").addEventListener("click", function () {
    panel.hidden = true;
  });

  function appendMsg(role, text, sources, link) {
    var wrap = document.createElement("div");
    wrap.className = "assistant-msg " + (role === "user" ? "assistant-user" : "assistant-bot");
    var label = role === "user" ? "You" : "Assistant";
    var html = '<div class="small fw-semibold text-muted mb-1">' + label + '</div><div class="small">' + escapeHtml(text) + '</div>';
    if (sources && sources.length) {
      html += '<div class="small text-muted mt-1"><i class="bi bi-journal-text me-1"></i>Sources: ' + sources.map(escapeHtml).join(", ") + '</div>';
    }
    if (link) {
      html += '<div class="mt-1"><a class="small" href="' + escapeHtml(link) + '" target="_blank">Related screen →</a></div>';
    }
    wrap.innerHTML = html;
    thread.appendChild(wrap);
    thread.scrollTop = thread.scrollHeight;
  }

  function escapeHtml(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function loadHistory() {
    fetch("/assistant/history", { headers: { "Accept": "application/json" } })
      .then(function (r) { return r.json(); })
      .then(function (data) {
        if (data.messages && data.messages.length) {
          data.messages.forEach(function (m) {
            appendMsg(m.role, m.content, m.sources, m.link);
          });
        }
      })
      .catch(function () {});
  }

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    var q = question.value.trim();
    if (!q) return;

    appendMsg("user", q, null, null);
    question.value = "";

    var typing = document.createElement("div");
    typing.className = "assistant-msg assistant-bot small text-muted";
    typing.textContent = "Thinking…";
    thread.appendChild(typing);
    thread.scrollTop = thread.scrollHeight;

    var currentUrl = window.location.pathname + window.location.search;
    var currentTitle = document.title || "";

    var clientCtx = {};
    var bgEl = document.querySelector("[data-bg-id]");
    if (bgEl) clientCtx.bg_id = bgEl.getAttribute("data-bg-id");
    var activeTab = document.querySelector(".nav-tabs .nav-link.active, .nav-pills .nav-link.active");
    if (activeTab) clientCtx.active_tab = activeTab.textContent.trim();

    var payload = {
      question: q,
      page_url: currentUrl,
      page_title: currentTitle,
      client_context: clientCtx
    };

    fetch("/assistant/ask", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "X-CSRFToken": csrf()
      },
      body: JSON.stringify(payload)
    })
      .then(function (r) { return r.json(); })
      .then(function (data) {
        typing.remove();
        if (data.error) {
          appendMsg("assistant", data.error, null, null);
        } else {
          appendMsg("assistant", data.answer, data.sources, data.link);
        }
      })
      .catch(function () {
        typing.remove();
        appendMsg("assistant", "I couldn't retrieve an answer just now. Please try again.", null, null);
      });
  });

  loadHistory();
})();
</script>{% endif %}
